# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Lets you deploy the backend + a managed Postgres database in one step:
# Render dashboard -> New -> Blueprint -> connect this GitHub repo -> Apply.
#
# DEEPSEEK_API_KEY, RAINFOREST_API_KEY, DATA_PROVIDER, and CORS_ORIGINS are
# all marked `sync: false`. This is deliberate for every one of them, not
# just the two secrets: any env var declared with a literal `value:` here
# gets reset to that literal value every time you click "Manual Sync" on
# the Blueprint (e.g. after recreating the database) - which would silently
# undo a manual switch to DATA_PROVIDER=rainforest, or CORS_ORIGINS being
# updated to include your Vercel URL, on the very next sync. `sync: false`
# means Render prompts you once and then leaves whatever you've set in the
# dashboard alone forever after, through any number of future syncs.
#
# If Blueprint auto-detection doesn't pick this up for any reason, the
# equivalent manual setup is documented in docs/SETUP.md under
# "Deploying the backend (Render)".

services:
  - type: web
    name: furniture-insight-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: furniture-insight-db
          property: connectionString
      - key: DATA_PROVIDER
        sync: false
        # Type "mock" (safe, offline default) or "rainforest" (real Amazon
        # data - also requires RAINFOREST_API_KEY below) when prompted.
      - key: LLM_PROVIDER
        value: deepseek
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: RAINFOREST_API_KEY
        sync: false
      - key: CHROMA_PERSIST_DIR
        value: /app/data/chroma
      - key: CORS_ORIGINS
        sync: false
        # Type "http://localhost:3000,https://your-app.vercel.app" (once
        # you know your Vercel URL) when prompted. Safe to leave as just
        # "http://localhost:3000" initially and update later - see
        # config.py's cors_origins_list fallback if this is ever left blank.

databases:
  - name: furniture-insight-db
    plan: free
    databaseName: product_hunter
    user: product_hunter
